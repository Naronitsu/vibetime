<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · VibeTime</title>
<link rel="stylesheet" href="style.css?v=fe20906f">
<script src="holidays.js?v=270cf135"></script>
<script src="app.js?v=84b31526"></script>
<script src="sky.js?v=5f491f8d"></script>
</head>
<body>
<div id="nav"></div>
<main class="w-today">
  <div class="today">
  <div class="today-main">
  <section class="panel hero">
    <div class="hero-text">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title">Today</h1>
      <p class="lede" id="lede"></p>
      <div class="wxline" id="wxline"></div>
      <span class="badge" id="qbadge"></span>
    </div>
    <svg class="scene" id="scene" data-wx="clear" viewBox="0 0 520 240" role="img" aria-label="Your progress through the quarter, climbing toward its last day">
      <g class="sungrp"><circle class="rays" cx="62" cy="42" r="28" fill="none" stroke-dasharray="3 8"/><circle class="sun stroke" cx="62" cy="42" r="19"/></g>
      <g class="cloud a"><ellipse cx="190" cy="62" rx="26" ry="11"/><ellipse cx="208" cy="55" rx="17" ry="12"/><ellipse cx="174" cy="57" rx="14" ry="9"/></g>
      <g class="cloud b"><ellipse cx="450" cy="92" rx="20" ry="8"/><ellipse cx="462" cy="86" rx="12" ry="9"/></g>
      <g class="stormclouds">
        <ellipse cx="70" cy="36" rx="58" ry="20"/><ellipse cx="120" cy="50" rx="44" ry="18"/><ellipse cx="30" cy="54" rx="34" ry="16"/>
        <ellipse cx="250" cy="30" rx="64" ry="22"/><ellipse cx="300" cy="48" rx="52" ry="18"/><ellipse cx="205" cy="48" rx="40" ry="16"/>
        <ellipse cx="450" cy="40" rx="62" ry="22"/><ellipse cx="500" cy="58" rx="40" ry="16"/><ellipse cx="400" cy="60" rx="44" ry="16"/>
      </g>
      <path class="m3 stroke" d="M-10 214 L70 128 L150 214 Z"/>
      <path class="m1 stroke" d="M96 214 L215 84 L330 214 Z"/>
      <path class="snow stroke" d="M215 84 L234 106 L224 101 L215 111 L206 100 L196 107 Z"/>
      <path class="m2 stroke" d="M270 214 L392 40 L530 214 Z"/>
      <path class="snow stroke" d="M392 40 L414 72 L402 66 L392 80 L381 66 L370 74 Z"/>
      <path class="m3 stroke" d="M-5 240 V205 Q120 192 260 206 T530 200 V240 Z"/>
      <g class="rain"><g id="rainin"></g></g>
      <path class="bolt" d="M262 20 L246 66 L260 66 L248 112 L282 56 L266 56 L276 20Z"/>
      <path class="trail" id="trail" d="M30 222 C95 214 118 188 170 186 S250 190 288 150 S348 96 388 56"/>
      <g class="flag"><line x1="392" y1="40" x2="392" y2="14" style="stroke:var(--line)" stroke-width="3" stroke-linecap="round"/><path d="M392 14 L418 21 L392 29 Z" style="fill:var(--accent);stroke:var(--line)" stroke-width="2.5" stroke-linejoin="round"/></g>
      <text id="lblStart" x="14" y="236"></text>
      <text id="lblEnd" x="424" y="36" text-anchor="start"></text>
      <g id="hikerPos"><g class="hiker">
        <rect x="-6" y="-6" width="12" height="11" rx="4" style="fill:var(--sky);stroke:var(--line)" stroke-width="2.5"/>
        <circle cx="0" cy="-13" r="6.5" style="fill:#ffd9b0;stroke:var(--line)" stroke-width="2.5"/>
        <path d="M-9 -16 L1 -32 L9 -16 Z" style="fill:var(--bad);stroke:var(--line)" stroke-width="2.5" stroke-linejoin="round"/>
      </g></g>
    </svg>
  </section>

  <div class="stats" id="stats"></div>

  <div class="leaves" id="leaves"></div>

  <div class="grid2">
    <section class="panel">
      <h2>Log the day</h2>
      <label class="f" for="date">Day</label>
      <input class="inp" type="date" id="date">
      <div class="lab mt"><label class="f" for="hours">Worked</label><button type="button" class="fill" data-fill="hours">Fill rest</button></div>
      <input class="inp big" id="hours" placeholder="e.g. 7h 45m" autocomplete="off">
      <div class="two mt">
        <div><div class="lab"><label class="f" for="ptoH">PTO</label><button type="button" class="fill" data-fill="ptoH">Fill rest</button></div><input class="inp" id="ptoH" placeholder="0h" autocomplete="off"></div>
        <div><div class="lab"><label class="f" for="sickH">Sick leave</label><button type="button" class="fill" data-fill="sickH">Fill rest</button></div><input class="inp" id="sickH" placeholder="0h" autocomplete="off"></div>
      </div>
      <div class="preview" id="preview"></div>
      <div class="row mt">
        <button class="btn primary" id="save">Save</button>
        <button class="btn danger" id="clear">Clear</button>
      </div>
    </section>

    <div>
      <section class="panel">
        <h2>Unlogged days</h2>
        <p class="dsub" style="margin:-6px 0 6px">Past working days with nothing logged yet. They don't count toward your balance until you fill them in.</p>
        <ul class="list" id="missing"></ul>
      </section>
      <section class="panel mt" id="holPanel">
        <h2>Public holidays</h2>
        <ul class="list" id="holidays"></ul>
      </section>
    </div>
  </div>
  </div>
  <aside class="rail" id="rail" aria-label="Your star chart for this quarter"></aside>
  </div>
</main>

<dialog id="ldlg">
  <div class="dbody">
    <div class="ltop">
      <h2 id="ltitle"></h2>
      <div class="yrnav"><button class="btn sm" id="lprev" aria-label="Previous year">&larr;</button><button class="btn sm" id="lnext" aria-label="Next year">&rarr;</button></div>
    </div>
    <p class="dsub" id="lsub"></p>
    <form id="lform" autocomplete="off">
      <div class="addgrid">
        <div><label class="f" for="lfrom">From</label><input class="inp" type="date" id="lfrom" required></div>
        <div><label class="f" for="lto">To <span class="opt">(optional)</span></label><input class="inp" type="date" id="lto"></div>
        <div><label class="f" for="lhrs">Hours per day <span class="opt">(blank = full day)</span></label><input class="inp" id="lhrs" placeholder="e.g. 4h"></div>
        <div class="addbtn"><button class="btn primary" type="submit">Book it</button></div>
      </div>
    </form>
    <div class="lmsg" id="lmsg" aria-live="polite"></div>
    <ul class="list lscroll" id="llist"></ul>
    <div class="dact"><span class="sp"></span><button class="btn" type="button" id="lclose">Done</button></div>
  </div>
</dialog>

<script>
renderNav('index.html');

const $ = id => document.getElementById(id);
const dateEl = $('date'), hoursEl = $('hours'), preview = $('preview');
dateEl.value = fmt(new Date());

let hikerDone = false;
function placeHiker(p) {
  const path = $('trail'), L = path.getTotalLength(), el = $('hikerPos');
  const put = k => { const pt = path.getPointAtLength(L * k); el.setAttribute('transform', `translate(${pt.x},${pt.y})`); };
  if (hikerDone || matchMedia('(prefers-reduced-motion: reduce)').matches) { put(p); hikerDone = true; return; }
  hikerDone = true;
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 1500); put(p * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// rain: slanted strokes on a lattice that repeats every 40px vertically, so the fall loops seamlessly
(() => {
  let r = '';
  for (let row = -2; row < 8; row++) for (let x = (row % 2 ? 13 : 0); x < 540; x += 26) r += `<line x1="${x}" y1="${row * 20}" x2="${x - 4}" y2="${row * 20 + 10}"/>`;
  document.getElementById('rainin').innerHTML = r;
})();

// this quarter's three months as constellations, shown beside the page on wide screens
function renderRail() {
  const now = new Date(), q0 = Math.floor(now.getMonth() / 3) * 3;
  let html = `<div class="railhead"><h2>Your sky</h2><a href="sky.html">Full year &rarr;</a></div>`;
  for (let m = q0; m < q0 + 3; m++) html += skyCardHTML(now.getFullYear(), m, m - q0, m === now.getMonth()).html;
  $('rail').innerHTML = html;
}
attachSkyTips($('rail'));

function weekCard() {
  const g = weekGroup(mondayOf(new Date()), 6, 6, 208, 84);
  return `<a class="panel stat weekcard" href="sky.html" aria-label="Open the star chart">
      <div class="k">This week's constellation</div>
      <div class="skybox"><svg viewBox="0 0 220 96" role="img" aria-label="This week's stars">${g.svg}</svg></div>
      <div class="s"><b>${g.lit} of ${g.n}</b> stars lit${g.complete ? ' · constellation complete' : ''}</div>
    </a>`;
}

function renderStats() {
  const s = stats(), { target, limitMax, limitMin } = state.settings;
  const hr = new Date().getHours();
  $('eyebrow').textContent = `${hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening'}, traveller`;
  $('title').textContent = longDate(s.today);

  const qd = s.qEnd.toLocaleDateString('en', { day: 'numeric', month: 'long' });
  const msg = Math.abs(s.gap) < 0.01 ? `Right on the trail. Nothing to make up before ${qd}.`
    : s.gap > 0 ? `You're carrying ${fh(s.gap, false)} extra. Take it back as time off before ${qd}.`
    : `You're ${fh(-s.gap, false)} short. Make it up before ${qd}.`;
  $('lede').textContent = `${msg} ${fd(s.remaining)} workday${s.remaining === 1 ? '' : 's'} to go.`;
  let [bc, bt] = Math.abs(s.gap) < 0.01 ? ['ok', 'On track']
    : s.remaining === 0 ? ['bad', 'Summit missed']
    : (s.needAvg > 12 || s.needAvg < 0) ? ['bad', 'Steep climb']
    : Math.abs(s.needAvg - target) > 1.5 ? ['warn', 'Needs a plan'] : ['ok', 'On the trail'];
  $('qbadge').className = `badge ${bc}`; $('qbadge').textContent = bt;
  const wx = weather(s.bal);
  $('scene').dataset.wx = wx.key;
  $('wxline').innerHTML = `<b>${wx.title}</b> · ${wx.text}`;

  const qs = new Date(s.today.getFullYear(), Math.floor(s.today.getMonth() / 3) * 3, 1);
  $('lblStart').textContent = qs.toLocaleDateString('en', { day: 'numeric', month: 'short' });
  $('lblEnd').textContent = s.qEnd.toLocaleDateString('en', { day: 'numeric', month: 'short' });
  placeHiker(Math.max(0, Math.min(1, (s.today - qs) / (s.qEnd - qs))));

  renderRail();
  $('stats').innerHTML = `
    <div class="panel stat">
      <div class="k">Balance</div>
      <div class="v huge ${cls(s.bal)}">${fhUnits(s.bal)}</div>
      <div class="s">${s.today.toLocaleString('en', { month: 'long' })} so far: <b class="tab">${fh(s.mDelta)}</b></div>
    </div>
    <div class="panel stat">
      <div class="k">Monthly limit</div>
      <div class="scale">
        <div class="sfill" style="left:${Math.min(s.zero, s.pct)}%;width:${Math.abs(s.pct - s.zero)}%;transform-origin:${s.pct < s.zero ? 'right' : 'left'}"></div>
        <div class="zero" style="left:${s.zero}%"></div>
        <div class="dot" style="left:${s.pct}%;--z:${s.zero}%"></div>
      </div>
      <div class="ends tab"><span>−${limitMin}h</span><span>+${limitMax}h</span></div>
      <div style="margin-top:10px"><span class="badge ${s.within ? 'ok' : 'bad'}">${s.within ? 'Within limit' : 'Outside limit'}</span></div>
    </div>${weekCard()}`;
}

function renderMissing() {
  const list = missingDays();
  $('missing').innerHTML = list.length ? list.map(d => `
    <li data-k="${fmt(d)}">
      <span class="d">${d.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span>
      <button class="btn sm" data-a="full">Log ${fh(state.settings.target, false)}</button>
      <button class="btn sm" data-a="pto">PTO</button>
      <button class="btn sm" data-a="sick">Sick</button>
      <button class="btn sm" data-a="edit">Edit</button>
    </li>`).join('') : '<li class="empty">All caught up.</li>';
}

const FIELD = { w: 'hours', pto: 'ptoH', sick: 'sickH' };
const fieldIds = Object.values(FIELD);
const readFields = () => Object.fromEntries(Object.entries(FIELD).map(([key, id]) => [key, parseHours($(id).value)]));
const num = x => (x == null || Number.isNaN(x)) ? 0 : x;

function loadDay() {
  const e = state.days[dateEl.value] || {};
  for (const [key, id] of Object.entries(FIELD)) { $(id).value = e[key] != null ? toInput(e[key]) : ''; $(id).classList.remove('invalid'); }
  updatePreview();
}
function updatePreview() {
  const k = dateEl.value; if (!k) { preview.textContent = ''; return; }
  const d = parseDate(k), e = state.days[k], exp = expectedFor(d), hol = holidayName(d);
  const locked = !isWorkday(d) && !e;
  for (const id of fieldIds) $(id).disabled = locked;
  $('ptoH').disabled = $('sickH').disabled = locked || exp === 0;
  $('save').disabled = locked;
  const v = readFields();
  for (const [key, id] of Object.entries(FIELD)) $(id).classList.toggle('invalid', Number.isNaN(v[key]));
  document.querySelectorAll('.fill').forEach(b => {
    const others = Object.entries(FIELD).filter(([, id]) => id !== b.dataset.fill).reduce((s, [key]) => s + num(v[key]), 0);
    b.disabled = locked || exp === 0 || exp - others <= 0;
  });
  if (locked) { preview.innerHTML = 'Not a working day. Change your working days in Settings.'; return; }
  if (Object.values(v).some(Number.isNaN)) { preview.innerHTML = '<span class="neg">Try 7h 45m, 7:45 or 7.75</span>'; return; }
  const any = Object.values(v).some(x => x != null);
  if (!any) { preview.textContent = hol ? `Public holiday: ${hol}. No hours expected.` : e ? '' : `Expected: ${fh(exp, false)}.`; return; }
  const tot = num(v.w) + (exp > 0 ? num(v.pto) + num(v.sick) : 0), dl = tot - exp;
  preview.innerHTML = `Total <b>${fh(tot, false)}</b>${exp ? ` of ${fh(exp, false)} expected` : ''}: <b class="${cls(dl)}">${Math.abs(dl) < 1e-9 ? 'on target' : fh(dl)}</b>`;
}
// ---- booking dates for a kind of leave
let leaveType = null, leaveYear = new Date().getFullYear();
const dayLabel = d => d.toLocaleDateString('en', { weekday: 'short', day: 'numeric', month: 'short' });

// Consecutive booked days (ignoring non-working days between them) form one period.
function contiguous(a, b) {
  const d = parseDate(a), end = parseDate(b);
  for (d.setDate(d.getDate() + 1); d < end; d.setDate(d.getDate() + 1)) if (expectedFor(d) > 0) return false;
  return true;
}
function leaveGroups(type, year) {
  const keys = Object.keys(state.days).filter(k => k.startsWith(`${year}-`) && state.days[k][type] > 0).sort();
  const groups = [];
  for (const k of keys) {
    const g = groups[groups.length - 1];
    if (g && contiguous(g[g.length - 1], k)) g.push(k); else groups.push([k]);
  }
  return groups;
}
function renderLeaveDlg() {
  const L = leaveStats(leaveYear)[leaveType], name = LEAVE_NAME[leaveType];
  $('ltitle').textContent = `${name} · ${leaveYear}`;
  $('lsub').textContent = L.total > 0
    ? `${fh(L.booked, false)} of ${fh(L.total, false)} booked, ${fh(L.remaining, false)} left.`
    : `${fh(L.booked, false)} booked. Set your yearly allowance in Settings.`;
  const today = fmt(new Date());
  const row = (k, extra = '') => {
    const d = parseDate(k), h = state.days[k][leaveType], counts = expectedFor(d) > 0;
    return `<li data-k="${k}"><span class="d">${dayLabel(d)}${counts ? '' : ' <em class="muted">(not a working day, not counted)</em>'}</span>
      <span class="tab">${fh(h, false)}</span>
      <button class="btn sm x" data-del="${k}" aria-label="Remove ${dayLabel(d)}">&times;</button></li>`;
  };
  const groups = leaveGroups(leaveType, leaveYear);
  $('llist').innerHTML = groups.length ? groups.map(g => {
    const first = g[0], last = g[g.length - 1];
    const status = first > today ? ['warn', 'planned'] : last < today ? ['ok', 'taken'] : first === today && last === today ? ['ok', 'today'] : ['ok', 'under way'];
    if (g.length === 1) {
      const d = parseDate(first), counts = expectedFor(d) > 0;
      return `<li data-k="${first}"><span class="d">${dayLabel(d)}${counts ? '' : ' <em class="muted">(not a working day, not counted)</em>'}</span>
        <span class="tab">${fh(state.days[first][leaveType], false)}</span><span class="badge ${status[0]}">${status[1]}</span>
        <button class="btn sm x" data-del="${first}" aria-label="Remove ${dayLabel(d)}">&times;</button></li>`;
    }
    const hrs = g.reduce((s, k) => s + state.days[k][leaveType], 0);
    return `<li class="grp"><details><summary>
        <span class="d"><b>${dayLabel(parseDate(first))} – ${dayLabel(parseDate(last))}</b> <em class="muted">${g.length} days</em></span>
        <span class="tab">${fh(hrs, false)}</span><span class="badge ${status[0]}">${status[1]}</span>
        <button class="btn sm x" data-delgroup="${g.join(',')}" aria-label="Remove this whole period">&times;</button>
      </summary><ul class="sub">${g.map(k => row(k)).join('')}</ul></details></li>`;
  }).join('') : `<li class="empty">No ${name} booked in ${leaveYear} yet.</li>`;
}
function openLeave(t) {
  leaveType = t; leaveYear = new Date().getFullYear();
  $('lfrom').value = fmt(new Date()); $('lto').value = ''; $('lhrs').value = ''; $('lmsg').textContent = '';
  renderLeaveDlg();
  $('ldlg').showModal();
}
const refreshAll = () => { renderStats(); renderLeaves(); renderMissing(); loadDay(); };
$('leaves').addEventListener('click', ev => { const p = ev.target.closest('[data-leave]'); if (p && !ev.target.closest('a')) openLeave(p.dataset.leave); });
$('leaves').addEventListener('keydown', ev => { const p = ev.target.closest('[data-leave]'); if (p && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openLeave(p.dataset.leave); } });
$('lprev').onclick = () => { leaveYear--; renderLeaveDlg(); };
$('lnext').onclick = () => { leaveYear++; renderLeaveDlg(); };
$('lclose').onclick = () => $('ldlg').close();
$('ldlg').addEventListener('click', ev => { if (ev.target === $('ldlg')) $('ldlg').close(); });
$('ldlg').addEventListener('close', refreshAll);
$('llist').addEventListener('click', ev => {
  const one = ev.target.closest('[data-del]'), many = ev.target.closest('[data-delgroup]');
  if (!one && !many) return;
  ev.preventDefault();                       // don't toggle the period open/closed
  if (one) setLeave(one.dataset.del, leaveType, 0);
  else { const ks = many.dataset.delgroup.split(','); ks.forEach(k => setLeave(k, leaveType, 0, false)); save(); }
  $('lmsg').textContent = ''; renderLeaveDlg();
});
$('lform').onsubmit = ev => {
  ev.preventDefault();
  const msg = (t, bad) => { $('lmsg').innerHTML = `<span class="${bad ? 'neg' : 'pos'}">${t}</span>`; };
  const from = parseDate($('lfrom').value), to = $('lto').value ? parseDate($('lto').value) : from;
  const hrs = parseHours($('lhrs').value);
  if (Number.isNaN(hrs)) return msg('Try 4h, 7:30 or 3.5 for the hours.', true);
  if (to < from) return msg('The end date is before the start date.', true);
  if ((to - from) / 864e5 > 400) return msg('That range is too long.', true);
  const amount = hrs > 0 ? hrs : state.settings.target;
  let added = 0, skipped = 0;
  for (const d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    if (expectedFor(d) === 0) { skipped++; continue; }
    setLeave(fmt(d), leaveType, amount, false); added++;
  }
  save();
  if (!added) return msg('Nothing booked: those dates are not working days.', true);
  leaveYear = from.getFullYear();
  renderLeaveDlg();
  msg(`Booked ${added} day${added === 1 ? '' : 's'}${skipped ? `, skipped ${skipped} non-working day${skipped === 1 ? '' : 's'}` : ''}.`);
  $('lto').value = '';
};

const BOTTLE = 'M30 14 V30 C30 40 12 44 12 62 V92 A14 14 0 0 0 26 106 H54 A14 14 0 0 0 68 92 V62 C68 44 50 40 50 30 V14 Z';
const WAVE = 'M-80 0 q10 -5 20 0' + ' t20 0'.repeat(11) + ' V120 H-80 Z';
function renderLeaves() {
  const y = new Date().getFullYear(), L = leaveStats(y);
  $('leaves').innerHTML = [['pto', 'PTO'], ['sick', 'Sick leave']].map(([t, name]) => {
    const x = L[t], set = x.total > 0;
    const frac = set ? Math.max(0, Math.min(1, x.remaining / x.total)) : 0;
    const lvl = 106 - 62 * frac;
    return `<div class="panel stat clickable ${t}" data-leave="${t}" role="button" tabindex="0" aria-label="Manage ${name} dates">
      <svg class="bottle" viewBox="0 0 80 110" aria-hidden="true">
        <defs><clipPath id="clip-${t}"><path d="${BOTTLE}"/></clipPath></defs>
        <g clip-path="url(#clip-${t})">
          <rect class="glass" x="0" y="0" width="80" height="110"/>
          <g class="level" style="transform:translateY(${lvl}px)"><path class="liq wave" d="${WAVE}"/></g>
        </g>
        <path class="shine" d="M21 68 V88"/>
        <path class="outline" d="${BOTTLE}"/>
        <rect class="cork" x="26" y="4" width="28" height="12" rx="4"/>
      </svg>
      <div class="body">
        <div class="k">${name} · ${y}</div>
        <div class="v ${x.remaining < 0 ? 'neg' : ''}">${fhUnits(set ? x.remaining : x.booked, false)} <small>${set ? 'left' : 'booked'}</small></div>
        <div class="split tab"><span><b>${fh(x.total, false)}</b>total</span><span><b>${fh(x.booked, false)}</b>booked</span><span><b>${fh(x.remaining, false)}</b>left</span></div>
        <div class="s">${fh(x.taken, false)} taken, ${fh(x.upcoming, false)} upcoming${set ? '' : ' · <a href="settings.html">set your allowance</a>'}</div>
        <div class="manage">Book or review dates &rarr;</div>
      </div>
    </div>`;
  }).join('');
}
function renderHolidays() {
  if (!state.settings.country) {
    $('holidays').innerHTML = `<li class="empty" style="display:block">Pick your country to see its public holidays here. They count as days off, so no hours are expected on them.<br><a href="settings.html">Choose your country &rarr;</a></li>`;
    return;
  }
  const up = upcomingHolidays(4);
  $('holidays').innerHTML = up.map(h => `<li><span class="d">${h.name}</span><span class="tab" style="color:var(--muted)">${h.date.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span></li>`).join('');
}
const refresh = () => { renderStats(); renderLeaves(); renderMissing(); renderHolidays(); loadDay(); };
const flash = msg => { preview.innerHTML = `<b class="pos">${msg}</b>`; };

dateEl.onchange = loadDay;
for (const id of fieldIds) { $(id).oninput = updatePreview; $(id).onkeydown = e => { if (e.key === 'Enter') $('save').click(); }; }
document.querySelectorAll('.fill').forEach(b => b.onclick = () => {
  const exp = expectedFor(parseDate(dateEl.value)), v = readFields();
  const others = Object.entries(FIELD).filter(([, id]) => id !== b.dataset.fill).reduce((s, [key]) => s + num(v[key]), 0);
  $(b.dataset.fill).value = toInput(Math.max(0, exp - others));
  updatePreview();
});
$('save').onclick = () => {
  const v = readFields();
  if (Object.values(v).some(Number.isNaN)) return;
  setEntry(dateEl.value, v);
  renderStats(); renderLeaves(); renderMissing(); flash('Saved');
};
$('clear').onclick = () => { setEntry(dateEl.value, {}); refresh(); flash('Cleared'); };

$('missing').onclick = ev => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  const k = b.closest('li').dataset.k;
  const T = state.settings.target;
  if (b.dataset.a === 'full') { setEntry(k, { w: T }); refresh(); }
  else if (b.dataset.a === 'pto') { setEntry(k, { pto: T }); refresh(); }
  else if (b.dataset.a === 'sick') { setEntry(k, { sick: T }); refresh(); }
  else { dateEl.value = k; loadDay(); hoursEl.focus(); }
};

window.addEventListener('holidays-updated', () => { renderStats(); renderLeaves(); renderMissing(); renderHolidays(); updatePreview(); });
refresh();
hoursEl.focus({ preventScroll: true });
</script>
</body>
</html>
