<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · VibeTime</title>
<link rel="stylesheet" href="style.css">
<script src="holidays.js"></script>
<script src="app.js"></script>
</head>
<body>
<div id="nav"></div>
<main>
  <h1>Settings</h1>
  <p class="lede">Changes apply immediately and are saved in this browser.</p>

  <section class="panel section">
    <h2>Work time</h2>
    <div class="fields">
      <div class="field"><span class="t"><b>Working days</b><span>Other days are locked and expect no hours.</span></span><div class="daypick" id="daypick"></div></div>
      <label class="field"><span class="t"><b>Country</b><span>Public holidays on working days expect no hours.</span></span><select class="inp" id="sCountry"></select></label>
      <label class="field"><span class="t"><b>Hours per workday</b><span>Expected on each working day.</span></span><input class="inp" type="number" step="0.25" min="0" id="sTarget"></label>
      <label class="field"><span class="t"><b>Tracking starts</b><span>Days before this date are ignored.</span></span><input class="inp" type="date" id="sStart"></label>
      <label class="field"><span class="t"><b>Opening balance (h)</b><span>Your plus/minus balance on the start date.</span></span><input class="inp" type="number" step="0.25" id="sOpening"></label>
    </div>
  </section>

  <section class="panel section">
    <h2>Time off allowance (per year)</h2>
    <div class="fields">
      <label class="field"><span class="t"><b>PTO per year</b><span>Total paid time off, e.g. 192h or 192h 30m.</span></span><input class="inp" id="sPto" placeholder="e.g. 192h"></label>
      <label class="field"><span class="t"><b>Sick leave per year</b><span>Total sick leave allowance, e.g. 80h.</span></span><input class="inp" id="sSick" placeholder="e.g. 80h"></label>
    </div>
  </section>

  <section class="panel section" id="holList" hidden></section>

  <section class="panel section">
    <h2>Limits</h2>
    <div class="fields">
      <label class="field"><span class="t"><b>Max monthly surplus (h)</b><span>Highest balance allowed at any month end.</span></span><input class="inp" type="number" step="0.5" min="0" id="sLimitMax"></label>
      <label class="field"><span class="t"><b>Max monthly deficit (h)</b><span>Lowest balance allowed, entered as a positive number.</span></span><input class="inp" type="number" step="0.5" min="0" id="sLimitMin"></label>
      <label class="field"><span class="t"><b>Balance required at quarter end (h)</b><span>Usually 0.</span></span><input class="inp" type="number" step="0.25" id="sQTarget"></label>
    </div>
  </section>

  <section class="panel section">
    <h2>Data</h2>
    <div class="row">
      <button class="btn" id="export">Export backup</button>
      <button class="btn" id="import">Import backup</button>
      <button class="btn danger" id="reset">Erase everything</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </section>
</main>

<script>
renderNav('settings.html');
const sMap = { sTarget:'target', sLimitMax:'limitMax', sLimitMin:'limitMin', sQTarget:'quarterTarget', sStart:'start', sOpening:'opening' };
const hMap = { sPto:'ptoTotal', sSick:'sickTotal' };
const loadSettings = () => {
  for (const id in sMap) document.getElementById(id).value = state.settings[sMap[id]];
  for (const id in hMap) document.getElementById(id).value = toInput(state.settings[hMap[id]]);
};
for (const id in hMap) document.getElementById(id).addEventListener('change', e => {
  const v = parseHours(e.target.value);
  if (Number.isNaN(v)) { e.target.classList.add('invalid'); return; }
  e.target.classList.remove('invalid');
  state.settings[hMap[id]] = v || 0; e.target.value = toInput(v || 0); save();
});
for (const id in sMap) document.getElementById(id).addEventListener('change', e => {
  if (!e.target.value) { loadSettings(); return; }
  state.settings[sMap[id]] = sMap[id] === 'start' ? e.target.value : Number(e.target.value);
  save();
});
loadSettings();

const countrySel = document.getElementById('sCountry');
countrySel.innerHTML = '<option value="">None</option>' + Object.entries(COUNTRIES).map(([c, v]) => `<option value="${c}">${v.name}</option>`).join('');
countrySel.value = state.settings.country;
countrySel.onchange = () => { state.settings.country = countrySel.value; save(); renderHolidayList(); };
function renderHolidayList() {
  const c = COUNTRIES[state.settings.country], el = document.getElementById('holList');
  if (!c) { el.hidden = true; return; }
  const y = new Date().getFullYear();
  el.hidden = false;
  el.innerHTML = `<h2>${c.name} public holidays ${y}</h2><ul class="list">` + c.holidays(y).map(h =>
    `<li><span class="d">${h.name}</span><span class="tab" style="color:var(--muted)">${parseDate(h.date).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span></li>`).join('') + '</ul>';
}
renderHolidayList();

const dayPick = document.getElementById('daypick');
const renderDays = () => {
  dayPick.innerHTML = [[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri'],[6,'Sat'],[0,'Sun']].map(([n, t]) =>
    `<label><input type="checkbox" value="${n}" ${state.settings.workDays.includes(n) ? 'checked' : ''}><span>${t}</span></label>`).join('');
};
dayPick.addEventListener('change', () => {
  state.settings.workDays = [...dayPick.querySelectorAll('input:checked')].map(i => Number(i.value));
  save();
});
renderDays();

document.getElementById('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  a.download = `flex-time-${fmt(new Date())}.json`; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!data.days || !data.settings) throw 0;
    state = data; state.settings = { ...defaults().settings, ...state.settings }; migrateDays(state.days); migrateSettings(); save(); loadSettings(); renderDays(); countrySel.value = state.settings.country; renderHolidayList(); applyTheme();
  } catch { alert('That file is not a valid export.'); }
  e.target.value = '';
};
document.getElementById('reset').onclick = () => {
  if (confirm('Erase all logged hours and settings?')) { state = defaults(); save(); loadSettings(); renderDays(); countrySel.value = ''; renderHolidayList(); applyTheme(); }
};
</script>
</body>
</html>
